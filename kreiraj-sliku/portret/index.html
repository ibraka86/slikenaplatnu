<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Portret | Slike na Platnu</title>
    <link rel="icon" type="image/png" href="../../favicon.png"/>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --magenta:   #E91E8C;
            --crimson:   #C62828;
            --amber:     #FF8F00;
            --violet:    #7B1FA2;
            --cobalt:    #1565C0;
            --teal:      #00838F;
            --ink:       #1A1A1A;
            --ink-soft:  #3D3D3D;
            --mute:      #7A7875;
            --line:      #E3E1DB;
            --paper:     #FAF8F3;
            --white:     #FFFFFF;
            --grad-full: linear-gradient(135deg,#E91E8C 0%,#C62828 22%,#FF8F00 42%,#7B1FA2 62%,#1565C0 80%,#00838F 100%);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Schibsted Grotesk', sans-serif;
            background: var(--white);
            color: var(--ink);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
        @media(max-width:768px){ .container{ padding: 0 24px; } }

        .grad-bar { height: 2px; background: var(--grad-full); }

        .display {
            font-family: 'Newsreader', serif;
            font-weight: 300;
            color: var(--ink);
            line-height: 1.05;
            letter-spacing: -.02em;
        }

        @keyframes shimmer {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-grad {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #E91E8C, #C62828, #FF8F00, #7B1FA2, #1565C0, #00838F, #E91E8C);
            background-size: 200% 200%;
            color: var(--white);
            font-family: 'Schibsted Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .08em;
            text-transform: uppercase;
            border: none;
            border-radius: 0;
            cursor: pointer;
            text-decoration: none;
            transition: all .4s cubic-bezier(.16,1,.3,1);
            position: relative;
            overflow: hidden;
            animation: shimmer 8s ease infinite;
        }
        .btn-grad:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 30, 140, .2); }

        /* ── DESIGN MODAL ─────────────────── */
        .design-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26,26,26,0.9); backdrop-filter: blur(10px); z-index: 2000;
            display: none; align-items: center; justify-content: center; padding: 40px;
        }
        .design-modal.open { display: flex; }
        .design-modal-content {
            background: var(--white); width: 100%; max-width: 1000px; max-height: 80vh;
            position: relative; padding: 60px; overflow-y: auto;
        }
        .close-modal {
            position: absolute; top: 24px; right: 24px; background: none; border: none;
            cursor: pointer; color: var(--ink); transition: transform .3s;
        }
        .design-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px; margin-top: 40px;
        }
        .design-item {
            aspect-ratio: 3/4; background: var(--paper); cursor: pointer; overflow: hidden;
            position: relative; border: 1px solid var(--line); transition: all .4s;
        }
        .design-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
        .design-item:hover { transform: translateY(-8px); border-color: var(--magenta); }
        .design-item:hover img { transform: scale(1.1); }

        .ms { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; }

        /* ── HEADER ────────────────────────── */
        .site-header { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--line); }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 48px; height: 76px; display: flex; align-items: center; justify-content: space-between; }
        .logo-wrap img { height: 40px; width: auto; display: block; }
        .site-nav { display: flex; align-items: center; gap: 40px; }
        .site-nav a { font-size: 14px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }

        /* ── PRODUCT ────────────────────────── */
        .product-section { padding: 60px 0 120px; }
        .product-grid { display: grid; grid-template-columns: 1fr 400px; gap: 60px; align-items: start; }
        @media(max-width: 1024px) { .product-grid { grid-template-columns: 1fr; } }

        .editor-wrapper { box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
        .editor-toolbar { display: flex; background: #232323; }
        .toolbar-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 18px 10px; background: none; border: none; color: #fff; cursor: pointer;
            font-family: 'Schibsted Grotesk'; font-size: 12px; text-transform: uppercase;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.08); color: var(--magenta); }

        .preview-area {
            width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden;
            background-image: url('room_mockup.png'); background-size: cover; background-position: center;
        }

        /* PORTRAIT CANVAS */
        .canvas-container-wrap {
            position: absolute; top: 12%; left: 54%; transform: translateX(-50%);
            width: 35%; /* Narrower for portrait */
            aspect-ratio: 0.75 / 1;
            z-index: 3; filter: drop-shadow(0 20px 50px rgba(0,0,0,0.3));
        }
        .panel-canvas { width: 100%; height: 100%; background: #fff; cursor: grab; }
        
        .side-tools { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
        .side-btn {
            width: 40px; height: 40px; border-radius: 4px; background: rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .options-group { margin-bottom: 24px; }
        .options-group-title { font-size: 14px; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; display: block; }
        .select-box { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; outline: none; }

        .price-wrap { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
        .price-amount { font-family: 'Newsreader', serif; font-size: 36px; font-weight: 500; }

        .site-footer { background: var(--ink); padding: 80px 0 40px; color: #fff; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="../../" class="logo-wrap">
            <img src="../../logo1.png" alt="Logo" style="width:105px; height:auto; transform:rotate(12deg) translateY(8px);"/>
        </a>
        <nav class="site-nav">
            <a href="../../nasi-radovi/">Naši radovi</a>
            <a href="../../vrste-slika/">Vrste slika</a>
            <a href="../../nacin-izrade/">Kako to radimo</a>
            <a href="../../kontakt/">Kontakt</a>
        </nav>
        <a href="../" class="btn-grad" style="padding:11px 24px; font-size:13px;">
            <span class="ms">photo_camera</span> Kreiraj sliku
        </a>
    </div>
</header>

<div class="grad-bar"></div>

<section class="product-section">
    <div class="container">
        <div style="margin-bottom: 40px;">
            <a href="../" style="text-decoration: none; color: var(--mute); font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">
                <span class="ms" style="font-size: 16px;">arrow_back</span> Nazad
            </a>
            <h1 class="display" style="font-size: 56px; margin-top: 16px;">Portret</h1>
            <p style="color: var(--ink-soft); max-width: 600px; margin-top: 12px;">Pretvorite vaše najdraže uspomene u prelijepe portrete na platnu.</p>
        </div>

        <div class="product-grid">
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <button class="toolbar-btn" id="btnAddImage"><span class="ms">add_photo_alternate</span> Dodaj Sliku</button>
                    <button class="toolbar-btn" id="btnAddText"><span class="ms">title</span> Tekst</button>
                    <button class="toolbar-btn" id="btnAddDesign"><span class="ms">auto_awesome_mosaic</span> Dizajn</button>
                </div>
                <div class="preview-area">
                    <div class="side-tools">
                        <button class="side-btn" id="btnZoomIn"><span class="ms">zoom_in</span></button>
                        <button class="side-btn" id="btnZoomOut"><span class="ms">zoom_out</span></button>
                        <button class="side-btn" id="btnRotate"><span class="ms">rotate_right</span></button>
                        <button class="side-btn" id="btnDelete"><span class="ms">delete</span></button>
                    </div>
                    <div class="canvas-container-wrap">
                        <canvas id="mainCanvas" class="panel-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <input type="file" id="imageUpload" style="display: none;" accept="image/*">
                <div class="options-group">
                    <label class="options-group-title">Dimenzija (cm)</label>
                    <select class="select-box" id="sizeSelect">
                        <option value="30x40" data-price="30">30x40 cm</option>
                        <option value="40x60" data-price="45" selected>40x60 cm</option>
                        <option value="50x70" data-price="65">50x70 cm</option>
                        <option value="60x80" data-price="85">60x80 cm</option>
                        <option value="70x100" data-price="110">70x100 cm</option>
                    </select>
                </div>
                <div class="options-group">
                    <label class="options-group-title">Debljina okvira</label>
                    <select class="select-box" id="depthSelect">
                        <option value="standard" data-price-modifier="0" selected>Standardni (2 cm)</option>
                        <option value="gallery" data-price-modifier="15">Galerijski (4 cm)</option>
                    </select>
                </div>
                <div class="price-wrap">
                    <span class="price-label">Ukupna cijena</span>
                    <span class="price-amount" id="priceDisplay">45 KM</span>
                </div>
                <button class="btn-grad" style="width: 100%; margin-top: 30px; padding: 18px;">Dodaj u korpu</button>
            </div>
        </div>
    </div>
</section>

<div class="design-modal" id="designModal">
    <div class="design-modal-content">
        <button class="close-modal" id="btnCloseModal"><span class="ms" style="font-size:32px;">close</span></button>
        <h2 class="display" style="font-size: 40px;">Naš Dizajn</h2>
        <div class="design-grid"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d'),
          sizeSelect = document.getElementById('sizeSelect'), depthSelect = document.getElementById('depthSelect'),
          priceDisplay = document.getElementById('priceDisplay'), imageUpload = document.getElementById('imageUpload');

    let srcImg = null, imgScale = 1, imgAngle = 0, imgPanX = 0, imgPanY = 0, dragging = false, dragX = 0, dragY = 0;

    function updatePrice() {
        let base = parseInt(sizeSelect.options[sizeSelect.selectedIndex].dataset.price);
        let mod = parseInt(depthSelect.options[depthSelect.selectedIndex].dataset.priceModifier);
        priceDisplay.textContent = (base + mod) + ' KM';
    }
    sizeSelect.onchange = updatePrice; depthSelect.onchange = updatePrice;

    function syncSizes() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width); canvas.height = Math.round(rect.height);
    }

    function render() {
        const cw = canvas.width, ch = canvas.height;
        ctx.clearRect(0, 0, cw, ch);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        if (!srcImg) return;

        const baseS = Math.max(cw / srcImg.naturalWidth, ch / srcImg.naturalHeight);
        const fs = baseS * imgScale;
        const iw = srcImg.naturalWidth * fs, ih = srcImg.naturalHeight * fs;
        const ix = (cw - iw) / 2 + imgPanX, iy = (ch - ih) / 2 + imgPanY;

        ctx.save();
        ctx.beginPath(); ctx.rect(0, 0, cw, ch); ctx.clip();
        ctx.translate(cw/2, ch/2); ctx.rotate(imgAngle * Math.PI / 180); ctx.translate(-cw/2, -ch/2);
        ctx.drawImage(srcImg, ix, iy, iw, ih);
        ctx.restore();
    }

    requestAnimationFrame(() => { syncSizes(); render(); });
    window.onresize = () => { syncSizes(); render(); };

    canvas.onmousedown = e => { if(!srcImg) return; dragging = true; dragX = e.clientX; dragY = e.clientY; e.preventDefault(); };
    window.onmousemove = e => { if(!dragging) return; imgPanX += e.clientX - dragX; imgPanY += e.clientY - dragY; dragX = e.clientX; dragY = e.clientY; render(); };
    window.onmouseup = () => dragging = false;

    document.getElementById('btnZoomIn').onclick = () => { imgScale *= 1.1; render(); };
    document.getElementById('btnZoomOut').onclick = () => { imgScale /= 1.1; render(); };
    document.getElementById('btnRotate').onclick = () => { imgAngle = (imgAngle + 90) % 360; render(); };
    document.getElementById('btnDelete').onclick = () => { srcImg = null; render(); };

    document.getElementById('btnAddImage').onclick = () => imageUpload.click();
    imageUpload.onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = ev => {
            const img = new Image();
            img.onload = () => { srcImg = img; imgScale = 1; imgAngle = 0; imgPanX = 0; imgPanY = 0; render(); };
            img.src = ev.target.result;
        };
        r.readAsDataURL(f);
    };

    const designModal = document.getElementById('designModal');
    document.getElementById('btnAddDesign').onclick = () => { designModal.classList.add('open'); loadDesignGallery(); };
    document.getElementById('btnCloseModal').onclick = () => designModal.classList.remove('open');

    function loadDesignGallery() {
        const grid = document.querySelector('.design-grid');
        grid.innerHTML = '<p>Učitavanje...</p>';
        const script = document.createElement('script');
        script.src = '../../nas-dizajn/manifest.js?t=' + Date.now();
        script.onload = () => {
            const files = window.nasDizajnManifest;
            if (!files || files.length === 0) { grid.innerHTML = '<p>Nema dizajna.</p>'; return; }
            grid.innerHTML = '';
            files.forEach(f => {
                const div = document.createElement('div'); div.className = 'design-item';
                div.innerHTML = `<img src="../../nas-dizajn/${f}" alt="Dizajn">`;
                div.onclick = () => {
                    const img = new Image();
                    img.onload = () => { srcImg = img; imgScale = 1; imgAngle = 0; imgPanX = 0; imgPanY = 0; render(); designModal.classList.remove('open'); };
                    img.src = `../../nas-dizajn/${f}`;
                };
                grid.appendChild(div);
            });
        };
        document.head.appendChild(script);
    }
</script>
</body>
</html>
