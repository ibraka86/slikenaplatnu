    <style>
        :root {
            --magenta:   #E91E8C;
            --crimson:   #C62828;
            --amber:     #FF8F00;
            --violet:    #7B1FA2;
            --cobalt:    #1565C0;
            --teal:      #00838F;
            --ink:       #1A1A1A;
            --ink-soft:  #3D3D3D;
            --mute:      #7A7875;
            --line:      #E3E1DB;
            --paper:     #FAF8F3;
            --white:     #FFFFFF;
            --grad-full: linear-gradient(135deg,#E91E8C 0%,#C62828 22%,#FF8F00 42%,#7B1FA2 62%,#1565C0 80%,#00838F 100%);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Schibsted Grotesk', sans-serif; background: var(--white); color: var(--ink); overflow-x: hidden; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
        .grad-bar { height: 2px; background: var(--grad-full); }
        .display { font-family: 'Newsreader', serif; font-weight: 300; line-height: 1.05; letter-spacing: -.02em; }

        .btn-grad {
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            padding: 16px 40px; background: linear-gradient(135deg, #E91E8C, #C62828, #FF8F00, #7B1FA2, #1565C0, #00838F, #E91E8C);
            background-size: 200% 200%; color: var(--white); font-size: 13px; font-weight: 500;
            text-transform: uppercase; border: none; cursor: pointer; text-decoration: none;
            transition: all .4s; animation: shimmer 8s ease infinite;
        }
        @keyframes shimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* ── PRODUCT ────────────────────────── */
        .product-section { padding: 60px 0 120px; }
        .product-grid { display: grid; grid-template-columns: 1fr 400px; gap: 60px; }
        @media(max-width: 1024px) { .product-grid { grid-template-columns: 1fr; } }

        .editor-wrapper { box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
        .editor-toolbar { display: flex; background: #232323; }
        .toolbar-btn {
            flex: 1; padding: 18px 10px; background: none; border: none; color: #fff; cursor: pointer;
            font-family: 'Schibsted Grotesk'; font-size: 12px; text-transform: uppercase;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .preview-area { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; background: url('room_mockup.png') center/cover; }

        /* SINGLE PANEL CANVAS (LANDSCAPE) */
        .canvas-container-wrap {
            position: absolute; top: 18%; left: 54%; transform: translateX(-50%);
            width: 45%;
            aspect-ratio: 1.5 / 1;
            z-index: 3; filter: drop-shadow(0 20px 50px rgba(0,0,0,0.3));
        }
        .panel-canvas { width: 100%; height: 100%; background: #fff; cursor: grab; }
        
        .side-tools { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
        .side-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.9); border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .options-group { margin-bottom: 24px; }
        .select-box { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; }
        .price-wrap { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
        .price-amount { font-family: 'Newsreader', serif; font-size: 36px; }

        /* MODAL */
        .design-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 40px; }
        .design-modal.open { display: flex; }
        .design-modal-content { background: #fff; width: 100%; max-width: 1000px; max-height: 80vh; padding: 60px; overflow-y: auto; position: relative; }
        .design-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 30px; }
        .design-item { cursor: pointer; border: 1px solid #eee; transition: .3s; }
        .design-item img { width: 100%; display: block; }
        .ms { font-family: 'Material Symbols Outlined'; }

<body>

<header class="site-header" style="height: 76px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line);">
    <a href="../../" style="display: block;"><img src="../../logo1.png" alt="Logo" style="width:105px;"/></a>
</header>
<div class="grad-bar"></div>

<section class="product-section">
    <div class="container">
        <div style="margin-bottom: 40px;">
            <a href="../" style="text-decoration: none; color: var(--mute); font-size: 14px; display: flex; align-items: center; gap: 8px;">
                <span class="ms">arrow_back</span> Nazad na katalog
            </a>
            <h1 class="display" style="font-size: 48px; margin-top: 16px;">Jednodijelna pravougaona slika na platnu</h1>
            <p style="color: var(--ink-soft); margin-top: 10px;">Klasičan pejzažni format za vaše najljepše panorame i fotografije.</p>
        </div>

        <div class="product-grid">
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <button class="toolbar-btn" id="btnAddImage"><span class="ms">add_photo_alternate</span> Dodaj Sliku</button>
                    <button class="toolbar-btn" id="btnAddDesign"><span class="ms">auto_awesome_mosaic</span> Naš Dizajn</button>
                </div>
                <div class="preview-area">
                    <div class="side-tools">
                        <button class="side-btn" id="btnZoomIn"><span class="ms">zoom_in</span></button>
                        <button class="side-btn" id="btnZoomOut"><span class="ms">zoom_out</span></button>
                        <button class="side-btn" id="btnRotate"><span class="ms">rotate_right</span></button>
                    </div>
                    <div class="canvas-container-wrap">
                        <canvas id="mainCanvas" class="panel-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <input type="file" id="imageUpload" style="display:none" accept="image/*">
                <div class="options-group">
                    <label style="font-weight:600; font-size:12px; text-transform:uppercase; margin-bottom:8px; display:block;">Dimenzija (cm)</label>
                    <select class="select-box" id="sizeSelect">
                        <option value="40x30" data-price="90">40x30 cm</option>
                        <option value="60x40" data-price="105" selected>60x40 cm</option>
                        <option value="80x60" data-price="130">80x60 cm</option>
                        <option value="100x70" data-price="160">100x70 cm</option>
                        <option value="120x80" data-price="190">120x80 cm</option>
                    </select>
                </div>
                <div class="price-wrap">
                    <span>Ukupna cijena</span>
                    <span class="price-amount" id="priceDisplay">105 KM</span>
                </div>
                <button class="btn-grad" id="addToCartBtn" style="width:100%; margin-top:30px;">Dodaj u korpu</button>
            </div>
        </div>
    </div>
</section>

<div class="design-modal" id="designModal">
    <div class="design-modal-content">
        <button id="btnCloseModal" style="position:absolute; top:20px; right:20px; border:none; background:none; cursor:pointer;"><span class="ms" style="font-size:32px;">close</span></button>
        <h2 class="display">Naš Dizajn</h2>
        <div class="design-grid"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d'),
          sizeSelect = document.getElementById('sizeSelect'), priceDisplay = document.getElementById('priceDisplay'),
          imageUpload = document.getElementById('imageUpload'), designModal = document.getElementById('designModal');

    let srcImg = null, imgScale = 1, imgAngle = 0, imgPanX = 0, imgPanY = 0, dragging = false, lastX=0, lastY=0;

    function syncSizes() {
        const r = canvas.getBoundingClientRect();
        canvas.width = Math.round(r.width); canvas.height = Math.round(r.height);
        render();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!srcImg) return;

        const fs = Math.max(canvas.width / srcImg.naturalWidth, canvas.height / srcImg.naturalHeight) * imgScale;
        const iw = srcImg.naturalWidth * fs, ih = srcImg.naturalHeight * fs;
        const ix = (canvas.width - iw)/2 + imgPanX, iy = (canvas.height - ih)/2 + imgPanY;

        ctx.save();
        ctx.beginPath(); ctx.rect(0,0,canvas.width,canvas.height); ctx.clip();
        ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(imgAngle * Math.PI / 180); ctx.translate(-canvas.width/2, -canvas.height/2);
        ctx.drawImage(srcImg, ix, iy, iw, ih);
        ctx.restore();
    }

    sizeSelect.onchange = () => { priceDisplay.textContent = sizeSelect.options[sizeSelect.selectedIndex].dataset.price + ' KM'; };

    canvas.onmousedown = e => { if(!srcImg) return; dragging=true; lastX=e.clientX; lastY=e.clientY; e.preventDefault(); };
    window.onmousemove = e => { if(!dragging) return; imgPanX += e.clientX - lastX; imgPanY += e.clientY - lastY; lastX=e.clientX; lastY=e.clientY; render(); };
    window.onmouseup = () => dragging = false;

    document.getElementById('btnZoomIn').onclick = () => { imgScale *= 1.1; render(); };
    document.getElementById('btnZoomOut').onclick = () => { imgScale /= 1.1; render(); };
    document.getElementById('btnRotate').onclick = () => { imgAngle = (imgAngle+90)%360; render(); };
    document.getElementById('btnAddImage').onclick = () => imageUpload.click();

    imageUpload.onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => { srcImg = img; imgScale=1; imgAngle=0; imgPanX=0; imgPanY=0; render(); };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(f);
    };

    document.getElementById('btnAddDesign').onclick = () => { designModal.classList.add('open'); loadGallery(); };
    document.getElementById('btnCloseModal').onclick = () => designModal.classList.remove('open');

    function loadGallery() {
        const grid = document.querySelector('.design-grid'); grid.innerHTML = '<p>Učitavanje...</p>';
        const s = document.createElement('script');
        s.src = '../../nas-dizajn/manifest.js?t=' + Date.now();
        s.onload = () => {
            const files = window.nasDizajnManifest;
            if(!files) return;
            grid.innerHTML = '';
            files.forEach(f => {
                const d = document.createElement('div'); d.className = 'design-item';
                d.innerHTML = `<img src="../../nas-dizajn/${f}">`;
                d.onclick = () => {
                    const i = new Image();
                    i.onload = () => { srcImg = i; imgScale=1; imgAngle=0; imgPanX=0; imgPanY=0; render(); designModal.classList.remove('open'); };
                    i.src = `../../nas-dizajn/${f}`;
                };
                grid.appendChild(d);
            });
        };
        document.head.appendChild(s);
    }

    window.onload = () => { syncSizes(); };
    window.onresize = syncSizes;
</script>
<script src="../../js/cart-logic.js"></script>
</body>
